version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: cashier-mongo
    ports:
      - '27017:27017'
    volumes:
      - cashier-mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: cashier-redis
    ports:
      - '6379:6379'

volumes:
  cashier-mongo-data:
